name: Release build

# 只构建发行包，不创建 Release。
# Release 由维护者用本人账号手动创建（网页或 API），这样发布记录的作者是维护者本人，
# 不会出现 github-actions[bot] 的署名。
on:
  workflow_dispatch:

jobs:
  build:
    name: 构建发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: 构建 wheel 与 sdist
        run: python -m build
      - name: 检查发行包
        run: twine check dist/*
      - name: 打包插件目录
        run: |
          cd astrbot_plugin_pcrjjc && zip -r ../pcrjjc-astrbot-plugin.zip . -x "*/__pycache__/*"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            pcrjjc-astrbot-plugin.zip
