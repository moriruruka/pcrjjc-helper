name: Release build

run-name: release-build · ${{ github.ref_name }}

# 仅构建发行包，不创建 Release。
# Release 由维护者在网页或通过 API 以本人账号创建，发布记录归属于维护者本人。
on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Archive plugin directory
        run: |
          cd astrbot_plugin_pcrjjc && zip -r ../pcrjjc-astrbot-plugin.zip . -x "*/__pycache__/*"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            pcrjjc-astrbot-plugin.zip
