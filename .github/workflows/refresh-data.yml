name: Data refresh

run-name: data-refresh · ${{ github.ref_name }}

# 周期性核对角色表：抓取 pcrdfans /units，合并本地别称，有差异时创建 PR 供审阅。
# 提交身份固定为仓库维护者。
on:
  # 仅手动触发：GitHub 会把 cron 触发的运行记录为 github-actions[bot]，
  # 本仓库要求所有提交与发布记录只归属维护者。
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[lite]"
      - name: Fetch latest character table
        run: python scripts/refresh_data.py
      - name: Commit and open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          author: "Aria_Luna <80839392+moriruruka@users.noreply.github.com>"
          committer: "Aria_Luna <80839392+moriruruka@users.noreply.github.com>"
          commit-message: "chore(data): refresh character table"
          title: "chore(data): refresh character table"
          body: |
            由 `Data refresh` 工作流生成：重新抓取 https://pcrdfans.com/units，
            并与 `aliases_extra.json` 合并。

            合并前请检查新增角色与对应中文名。
          branch: chore/refresh-characters
          delete-branch: true

  live-check:
    name: live-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[full]"
      - name: Query upstream API
        run: |
          python - <<'PY'
          import asyncio

          from pcrjjc import arena_api

          async def main():
              client = arena_api.ArenaClient(region=1, timeout=20)
              try:
                  entries = await client.search([100701, 107101, 100501], allow_missing_auth=True)
              except arena_api.ArenaError as exc:
                  print(f"upstream unavailable: {exc.kind}: {exc}")
                  return
              print(f"entries: {len(entries)}")

          asyncio.run(main())
          PY
