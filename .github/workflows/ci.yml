name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: 测试 ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[full,dev]"
      - name: 运行单元测试
        run: python -m pytest -q
      - name: 命令行自检
        run: python -m pcrjjc selftest

  data:
    name: 校验角色表
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 characters.json
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path("astrbot_plugin_pcrjjc/pcrjjc/data/characters.json").read_text(encoding="utf-8"))
          chars = payload.get("characters") or []
          assert len(chars) > 300, f"角色数量异常：{len(chars)}"
          ids = [c["id"] for c in chars]
          assert len(set(ids)) == len(ids), "存在重复 id"
          assert all(isinstance(i, int) and 100000 <= i <= 999999 for i in ids), "id 不是 6 位整数"
          for c in chars:
              assert (c.get("name") or c.get("name_jp") or "").strip(), f"角色缺少名字：{c}"
              assert isinstance(c.get("aliases") or [], list), "aliases 必须是列表"
          print(f"OK：{len(chars)} 个角色")
          PY

  build:
    name: 构建发行包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  install-smoke:
    name: 安装冒烟测试
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 在干净虚拟环境中安装并自检
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl "numpy>=1.24" "opencv-python-headless>=4.8"
          /tmp/venv/bin/pcrjjc selftest
          /tmp/venv/bin/pcrjjc doctor

  offline-e2e:
    name: 离线端到端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[full]"
      - name: 合成素材的识别与卡片渲染
        run: |
          python scripts/make_fixtures.py --out /tmp/fx
          python -m pcrjjc recognize -i /tmp/fx/screenshot.png --avatars /tmp/fx/avatars
      - name: 离线响应解析
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pcrjjc import arena_api

          payload = json.loads(Path("tests/fixtures/arena_payload.json").read_text(encoding="utf-8"))
          entries = arena_api.normalize_result(payload["data"]["data"])
          assert len(entries) == 2
          assert entries[0]["up"] == 12
          print("offline arena parse OK")
          PY
