name: CI

run-name: CI · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[full,dev]"
      - name: Run pytest
        run: python -m pytest -q
      - name: Run selftest
        run: python -m pcrjjc selftest

  data:
    name: data-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate characters.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("astrbot_plugin_pcrjjc/pcrjjc/data/characters.json").read_text(encoding="utf-8")
          )
          chars = payload.get("characters") or []
          assert len(chars) > 300, f"character count too low: {len(chars)}"
          ids = [c["id"] for c in chars]
          assert len(set(ids)) == len(ids), "duplicate ids"
          assert all(isinstance(i, int) and 100000 <= i <= 999999 for i in ids), "id must be 6 digits"
          for c in chars:
              assert (c.get("name") or c.get("name_jp") or "").strip(), f"missing name: {c}"
              assert isinstance(c.get("aliases") or [], list), "aliases must be a list"
          print(f"OK: {len(chars)} characters")
          PY

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  install-smoke:
    name: install-smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl "numpy>=1.24" "opencv-python-headless>=4.8"
      - name: Run selftest and doctor
        run: |
          /tmp/venv/bin/pcrjjc selftest
          /tmp/venv/bin/pcrjjc doctor

  offline-e2e:
    name: offline-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[full]"
      - name: Recognize synthetic screenshot and render card
        run: |
          python scripts/make_fixtures.py --out /tmp/fx
          python -m pcrjjc recognize -i /tmp/fx/screenshot.png --avatars /tmp/fx/avatars
      - name: Parse recorded arena response
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from pcrjjc import arena_api

          payload = json.loads(Path("tests/fixtures/arena_payload.json").read_text(encoding="utf-8"))
          entries = arena_api.normalize_result(payload["data"]["data"])
          assert len(entries) == 2
          assert entries[0]["up"] == 12
          print("arena response parsed")
          PY
