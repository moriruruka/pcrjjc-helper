[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pcrjjc-helper"
version = "0.1.0"
description = "公主连结竞技场作业查询核心库：截图识别防守阵容、按角色名查作业、渲染作业卡片"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pcrjjc-helper contributors" }]
keywords = ["priconne", "pcr", "arena", "pcrdfans", "astrbot", "onebot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "Pillow>=10.0",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
# 只查文字：基础依赖就够
lite = []
# 需要“发截图识阵容”再装这个（约 40MB）
full = ["numpy>=1.24", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
pcrjjc = "pcrjjc.cli:main"

[project.urls]
Homepage = "https://github.com/moriruruka/pcrjjc-helper"
Issues = "https://github.com/moriruruka/pcrjjc-helper/issues"

[tool.hatch.build.targets.wheel]
packages = ["astrbot_plugin_pcrjjc/pcrjjc"]

[tool.hatch.build.targets.sdist]
include = [
  "/astrbot_plugin_pcrjjc",
  "/docs",
  "/scripts",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".git", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["pcrjjc"]
